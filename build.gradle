plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(), '--existing',
                file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources.srcDir('src/generated/resources')

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def emberGeneratedResources = layout.buildDirectory.dir('generated/emberandfrost')
sourceSets.main.resources.srcDir(emberGeneratedResources)

tasks.register('generateEmberFrostResources') {
    outputs.dir(emberGeneratedResources)
    doLast {
        def root = emberGeneratedResources.get().asFile
        // High-detail 64x64 pixel-art item textures. Draw on a 16x16 logical canvas,
        // then upscale with nearest-neighbour so every pixel remains crisp.
        def palettes = [
            cinder: [[48,22,20],[119,42,30],[184,63,38],[244,117,53],[255,190,91],[255,226,151]],
            cryolite: [[13,35,65],[24,82,133],[38,139,190],[86,195,229],[167,235,249],[230,255,255]],
            ashen: [[35,36,39],[75,77,79],[121,123,121],[166,166,157],[211,207,190],[242,234,213]],
            magma: [[57,19,9],[124,37,11],[191,64,13],[242,111,17],[255,177,40],[255,228,115]],
            charolite: [[35,19,53],[80,39,120],[130,70,178],[180,112,219],[224,177,246],[247,226,255]]
        ]
        def writeTexture = { String relative, String material, String kind ->
            def pal = palettes[material]
            def image = new java.awt.image.BufferedImage(16,16,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = image.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
            def color = { c -> new java.awt.Color(c[0],c[1],c[2],255) }
            def fill = { int x,int y,int w,int h,c -> g.setColor(color(c)); g.fillRect(x,y,w,h) }
            def line = { int x1,int y1,int x2,int y2,c,int width=1 -> g.setColor(color(c)); g.setStroke(new java.awt.BasicStroke(width)); g.drawLine(x1,y1,x2,y2) }
            def poly = { int[] xs,int[] ys,c ->
                g.setColor(color(c)); g.fillPolygon(xs,ys,xs.length)
                g.setColor(new java.awt.Color(27,21,23,255)); g.drawPolygon(xs,ys,xs.length)
            }
            def wood=[93,61,40], woodLight=[155,105,62], outline=[27,21,23]
            if(kind=='ore') {
                def rnd=new java.util.Random(material.hashCode())
                for(int y=0;y<16;y++) for(int x=0;x<16;x++) {
                    def n=(x*13+y*7+x*y*3)%9
                    fill(x,y,1,1,n<2 ? [39,37,36] : [[55,52,49],[67,63,58],[76,72,66]][n%3])
                }
                15.times {
                    int x=rnd.nextInt(13)+1, y=rnd.nextInt(13)+1
                    def c=pal[[1,2,2,3,4][rnd.nextInt(5)]]
                    fill(x,y,2,2,c); if(x<15) fill(x+1,y-1,1,2,pal[2])
                    fill(x,y,1,1,pal[5])
                }
                // small mineral glints
                8.times { int x=rnd.nextInt(16),y=rnd.nextInt(16); fill(x,y,1,1,pal[5]) }
            } else if(kind=='ingot') {
                poly([2,5,12,14,12,4] as int[],[7,4,4,7,12,12] as int[],pal[2])
                fill(4,6,8,2,pal[4]); fill(6,5,5,1,pal[5]); line(3,8,5,11,pal[0]); line(5,11,11,11,pal[1])
                fill(3,7,1,2,pal[1]); fill(12,7,1,2,pal[1])
            } else if(kind=='raw') {
                poly([2,4,7,9,12,14,12,8,4] as int[],[8,4,3,1,3,7,12,14,12] as int[],pal[1])
                poly([4,7,7,9,11,9,5] as int[],[7,4,3,4,6,8,10] as int[],pal[4])
                fill(8,5,2,2,pal[5]); fill(9,9,3,2,pal[2]); fill(5,11,3,1,pal[0])
            } else if(kind=='shard') {
                poly([7,9,12,11,8,5,3,5] as int[],[1,3,6,10,14,13,8,4] as int[],pal[2])
                poly([7,9,10,8,5] as int[],[2,5,8,11,7] as int[],pal[4]); fill(7,5,2,2,pal[5]); line(5,9,7,12,pal[1])
            } else if(kind in ['helmet','chestplate','leggings','boots']) {
                if(kind=='helmet') {
                    poly([3,5,8,12,14,14,11,5,2] as int[],[7,3,1,2,6,11,13,13,10] as int[],pal[2])
                    fill(4,7,9,2,pal[1]); fill(5,7,7,1,pal[0]); line(5,5,8,3,pal[4]); line(8,3,12,4,pal[5])
                    fill(6,9,2,1,pal[4]); fill(10,9,2,1,pal[4]); line(4,11,12,11,pal[0])
                } else if(kind=='chestplate') {
                    poly([4,7,9,11,14,15,13,13,3,3,1] as int[],[2,3,4,3,2,5,8,14,14,8,5] as int[],pal[2])
                    line(4,4,7,7,pal[4]); line(7,7,8,5,pal[5]); line(12,5,14,4,pal[4])
                    line(8,5,8,13,pal[0],2); fill(4,9,3,3,pal[1]); fill(10,9,3,3,pal[1])
                    fill(5,3,2,1,pal[5]); fill(10,3,2,1,pal[5])
                } else if(kind=='leggings') {
                    poly([3,2,13,2,14,6,12,8,12,14,9,14,8,8,7,14,3,14,3,8,2,6] as int[],[2,2,6,8,14,14,8,14,14,8,6] as int[],pal[2])
                    line(4,4,12,4,pal[4]); line(8,5,8,13,pal[0]); fill(4,7,2,4,pal[1]); fill(10,7,2,4,pal[1])
                } else {
                    poly([2,3,7,3,8,8,7,12,2,12,1,9] as int[],[3,3,8,12,12,9] as int[],pal[2])
                    poly([9,3,14,3,15,9,14,12,9,12,8,8] as int[],[3,3,9,12,12,8] as int[],pal[2])
                    line(2,4,6,4,pal[4]); line(10,4,14,4,pal[4]); line(2,10,6,10,pal[0]); line(10,10,14,10,pal[0])
                }
                // inset rivets and bright material-specific trim
                fill(7,6,1,1,pal[5]); fill(8,7,1,1,pal[4])
            } else {
                // Shared wooden haft, dark outline and metal head for all tools.
                line(4,13,12,5,outline,3); line(5,13,12,6,wood,2); fill(7,10,1,1,woodLight)
                if(kind=='sword') {
                    poly([11,1,14,1,9,9,7,10,8,7] as int[],[1,1,9,10,7] as int[],pal[2])
                    line(11,2,9,6,pal[5]); line(5,9,9,13,pal[4],2); fill(3,12,3,1,pal[1])
                } else if(kind=='pickaxe') {
                    poly([2,3,5,1,9,2,13,1,15,3,12,5,8,4,5,6] as int[],[3,1,2,1,3,5,4,6] as int[],pal[2])
                    line(3,3,6,2,pal[4]); line(9,3,13,2,pal[5]); fill(2,3,2,1,pal[3])
                } else if(kind=='axe') {
                    poly([8,2,12,1,15,3,15,7,12,9,8,7,9,5,6,5] as int[],[2,1,3,7,9,7,5,5] as int[],pal[2])
                    line(10,2,13,2,pal[5]); line(14,3,14,6,pal[4])
                } else if(kind=='shovel') {
                    poly([10,1,13,2,14,5,11,8,8,6,8,3] as int[],[1,2,5,8,6,3] as int[],pal[2])
                    line(10,2,12,3,pal[5]); fill(10,5,2,1,pal[4])
                } else if(kind=='hoe') {
                    line(5,13,12,4,outline,3); line(6,13,12,5,wood,2)
                    poly([9,2,12,1,15,3,14,5,11,4,9,5] as int[],[2,1,3,5,4,5] as int[],pal[2])
                    fill(12,2,2,1,pal[5]); line(9,4,12,4,pal[4])
                }
            }
            g.dispose()
            def out = new java.awt.image.BufferedImage(64,64,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def og=out.createGraphics()
            og.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
            og.drawImage(image,0,0,64,64,null); og.dispose()
            def target = new File(root,"assets/emberandfrost/textures/${relative}.png")
            target.parentFile.mkdirs(); javax.imageio.ImageIO.write(out,'png',target)
        }
        ['cinder','cryolite','ashen','magma'].each { mat ->
            ['sword','pickaxe','axe','shovel','hoe','helmet','chestplate','leggings','boots'].each { piece -> writeTexture("item/${mat}_${piece}",mat,piece) }
            writeTexture("item/${mat}_ingot",mat,'ingot')
            writeTexture("item/raw_${mat}",mat,'raw')
            writeTexture("block/${mat}_ore",mat,'ore')
        }
        writeTexture('item/charolite_shard','charolite','shard')
        writeTexture('block/charolite_ore','charolite','ore')

        // 64x32 vanilla humanoid armor UV layouts; transparent gaps remain untouched.
        def armorPalettes = palettes.findAll { k,v -> k!='charolite' }
        armorPalettes.each { set,pal ->
            ['humanoid','humanoid_leggings'].each { layer ->
                def img=new java.awt.image.BufferedImage(64,32,java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def g=img.createGraphics()
                def plate={int x,int y,int w,int h,int shade ->
                    g.setColor(new java.awt.Color(pal[shade][0],pal[shade][1],pal[shade][2],255)); g.fillRect(x,y,w,h)
                    g.setColor(new java.awt.Color(pal[4][0],pal[4][1],pal[4][2],255)); g.drawLine(x,y,x+w-1,y)
                    g.setColor(new java.awt.Color(pal[0][0],pal[0][1],pal[0][2],255)); g.drawLine(x,y+h-1,x+w-1,y+h-1)
                    if(w>4 && h>4){g.setColor(new java.awt.Color(pal[1][0],pal[1][1],pal[1][2],255));g.drawLine(x+w/2,y+2,x+w/2,y+h-2)}
                }
                if(layer=='humanoid') {
                    [[8,0,8,8,2],[0,8,8,8,1],[8,8,8,8,3],[16,8,8,8,2],[24,8,8,8,1],
                     [20,16,8,12,2],[32,16,8,12,1],[16,16,4,12,3],[28,16,4,12,2],
                     [44,16,4,12,2],[48,16,4,12,1],[40,16,4,12,3],[52,16,4,12,2]].each { a -> plate(a[0],a[1],a[2],a[3],a[4]) }
                    g.setColor(new java.awt.Color(pal[4][0],pal[4][1],pal[4][2],255))
                    g.fillPolygon([22,25,26,23,21] as int[],[18,18,21,24,21] as int[],5)
                    g.setColor(new java.awt.Color(pal[5][0],pal[5][1],pal[5][2],255)); g.fillRect(23,19,1,2)
                } else {
                    [[0,0,8,8,2],[8,0,8,8,1],[16,0,8,8,3],[24,0,8,8,2],
                     [0,8,4,12,2],[4,8,4,12,1],[8,8,4,12,3],[12,8,4,12,2],
                     [16,8,4,12,2],[20,8,4,12,1],[24,8,4,12,3],[28,8,4,12,2]].each { a -> plate(a[0],a[1],a[2],a[3],a[4]) }
                }
                g.dispose()
                def folder=layer=='humanoid'?'humanoid':'humanoid_leggings'
                def out=new File(root,"assets/emberandfrost/textures/entity/equipment/${folder}/${set}.png")
                out.parentFile.mkdirs(); javax.imageio.ImageIO.write(img,'png',out)
            }
        }
        def writeJson = { String relativePath, Object value ->
            if (!file("src/main/resources/${relativePath}").exists()) {
                def target = new File(root, relativePath)
                target.parentFile.mkdirs()
                target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value))
            }
        }
        ['cinder','cryolite','ashen','magma'].each { set ->
            writeJson("assets/emberandfrost/equipment/${set}.json", [layers:[
                humanoid:[[texture:"emberandfrost:${set}"]],
                humanoid_leggings:[[texture:"emberandfrost:${set}"]]
            ]])
        }
        def oreLoot = { String oreName, String dropName ->
            def silkCondition = [
                condition:'minecraft:match_tool',
                predicate:[predicates:['minecraft:enchantments':[[enchantments:'minecraft:silk_touch', levels:[min:1]]]]]
            ]
            def silkEntry = [type:'minecraft:item', name:"emberandfrost:${oreName}", conditions:[silkCondition]]
            def normalEntry = [type:'minecraft:item', name:"emberandfrost:${dropName}"]
            def alternatives = [type:'minecraft:alternatives', children:[silkEntry, normalEntry]]
            def pool = [rolls:1, entries:[alternatives]]
            [type:'minecraft:block', pools:[pool]]
        }
        def sets = [
            [id:'cinder', ru:'Углерун', ing:'cinder_ingot', ore:'cinder_ore', catalyst:'minecraft:magma_cream'],
            [id:'cryolite', ru:'Криолит', ing:'cryolite_ingot', ore:'cryolite_ore', catalyst:'minecraft:packed_ice'],
            [id:'ashen', ru:'Пепельный', ing:'ashen_ingot', ore:'ashen_ore', catalyst:'minecraft:basalt'],
            [id:'magma', ru:'Магмовый', ing:'magma_ingot', ore:'magma_ore', catalyst:'minecraft:fire_charge']
        ]
        def pieces = [
            [id:'helmet', ru:'шлем', pattern:['AAA','A A','   ']],
            [id:'chestplate', ru:'нагрудник', pattern:['A A','ABA','AAA']],
            [id:'leggings', ru:'поножи', pattern:['AAA','A A','A A']],
            [id:'boots', ru:'ботинки', pattern:['A A','A A','   ']],
            [id:'sword', ru:'меч', pattern:['A','A','B'], handheld:true],
            [id:'pickaxe', ru:'кирка', pattern:['AAA',' B ',' B '], handheld:true],
            [id:'axe', ru:'топор', pattern:['AA','AB',' B'], handheld:true],
            [id:'shovel', ru:'лопата', pattern:['A','B','B'], handheld:true],
            [id:'hoe', ru:'мотыга', pattern:['AA',' B',' B'], handheld:true]
        ]
        def ru = [
            'item.emberandfrost.cinder_ingot':'Слиток Углеруна',
            'item.emberandfrost.raw_cinder':'Необработанный Углерун',
            'item.emberandfrost.cryolite_ingot':'Слиток Криолита',
            'item.emberandfrost.raw_cryolite':'Необработанный Криолит',
            'item.emberandfrost.ashen_ingot':'Слиток Пепельного',
            'item.emberandfrost.raw_ashen':'Необработанный Пепельный',
            'item.emberandfrost.magma_ingot':'Слиток Магмы',
            'item.emberandfrost.raw_magma':'Необработанная Магма',
            'item.emberandfrost.charolite_shard':'Чаролитовый осколок',
            'block.emberandfrost.cinder_ore':'Углеруновая руда',
            'block.emberandfrost.cryolite_ore':'Криолитовая руда',
            'block.emberandfrost.ashen_ore':'Пепельная руда',
            'block.emberandfrost.magma_ore':'Магмовая руда',
            'block.emberandfrost.charolite_ore':'Чаролитовая руда'
        ]
        def en = [
            'item.emberandfrost.cinder_ingot':'Cinder Ingot','item.emberandfrost.raw_cinder':'Raw Cinder',
            'item.emberandfrost.cryolite_ingot':'Cryolite Ingot','item.emberandfrost.raw_cryolite':'Raw Cryolite',
            'item.emberandfrost.ashen_ingot':'Ashen Ingot','item.emberandfrost.raw_ashen':'Raw Ashen',
            'item.emberandfrost.magma_ingot':'Magma Ingot','item.emberandfrost.raw_magma':'Raw Magma',
            'item.emberandfrost.charolite_shard':'Charolite Shard',
            'block.emberandfrost.cinder_ore':'Cinder Ore','block.emberandfrost.cryolite_ore':'Cryolite Ore',
            'block.emberandfrost.ashen_ore':'Ashen Ore','block.emberandfrost.magma_ore':'Magma Ore',
            'block.emberandfrost.charolite_ore':'Charolite Ore'
        ]
        sets.each { s ->
            pieces.each { p ->
                def name = "${s.id}_${p.id}"
                def key = [A:[item:"emberandfrost:${s.ing}"]]
                if (p.handheld) key.B = [item:'minecraft:stick']
                if (p.id == 'chestplate') key.B = [item:s.catalyst]
                writeJson("data/emberandfrost/recipe/${name}.json", [type:'minecraft:crafting_shaped', pattern:p.pattern, key:key, result:[id:"emberandfrost:${name}"]])
                writeJson("assets/emberandfrost/models/item/${name}.json", [parent:(p.handheld ? 'minecraft:item/handheld' : 'minecraft:item/generated'), textures:[layer0:"emberandfrost:item/${name}"]])
                writeJson("assets/emberandfrost/items/${name}.json", [model:[type:'minecraft:model', model:"emberandfrost:item/${name}"]])
                ru["item.emberandfrost.${name}"] = "${s.ru} ${p.ru}"
                en["item.emberandfrost.${name}"] = "${s.id.capitalize()} ${p.id.capitalize()}"
            }
            writeJson("data/emberandfrost/tags/item/repairs_${s.id}.json", [replace:false, values:["emberandfrost:${s.ing}"]])
            writeJson("data/emberandfrost/loot_table/blocks/${s.ore}.json", oreLoot(s.ore, "raw_${s.id}"))
            writeJson("assets/emberandfrost/blockstates/${s.ore}.json", [variants:['':[model:"emberandfrost:block/${s.ore}"]]])
            def texture = s.id == 'magma' ? 'netherrack' : (s.id == 'cryolite' ? 'packed_ice' : (s.id == 'ashen' ? 'blackstone' : 'deepslate'))
            writeJson("assets/emberandfrost/models/block/${s.ore}.json", [parent:'minecraft:block/cube_all', textures:[all:"emberandfrost:block/${s.ore}"]])
            writeJson("data/emberandfrost/tags/item/repairs_${s.id}.json", [replace:false, values:["emberandfrost:${s.ing}"]])
        }
        writeJson('data/emberandfrost/tags/item/repairs_armor.json', [replace:false, values:['emberandfrost:cinder_ingot','emberandfrost:cryolite_ingot','emberandfrost:ashen_ingot','emberandfrost:magma_ingot']])
        ['cinder_ingot','raw_cinder','cryolite_ingot','raw_cryolite','ashen_ingot','raw_ashen','magma_ingot','raw_magma','charolite_shard'].each { item ->
            writeJson("assets/emberandfrost/items/${item}.json", [model:[type:'minecraft:model', model:"emberandfrost:item/${item}"]])
            writeJson("assets/emberandfrost/models/item/${item}.json", [parent:'minecraft:item/generated', textures:[layer0:"emberandfrost:item/${item}"]])
        }
        ['cinder_ore','cryolite_ore','ashen_ore','magma_ore','charolite_ore'].each { ore ->
            writeJson("assets/emberandfrost/items/${ore}.json", [model:[type:'minecraft:model', model:"emberandfrost:block/${ore}"]])
        }
        writeJson('assets/emberandfrost/lang/ru_ru.json', ru)
        writeJson('assets/emberandfrost/lang/en_us.json', en)

        // Smelting and blasting for the four raw materials.
        sets.each { s ->
            ['smelting':200, 'blasting':100].each { recipeType, ticks ->
                writeJson("data/emberandfrost/recipe/${s.id}_${recipeType}.json", [
                    type:"minecraft:${recipeType}", category:'misc', cookingtime:ticks,
                    experience:0.7, ingredient:[item:"emberandfrost:raw_${s.id}"],
                    result:[id:"emberandfrost:${s.ing}"]
                ])
            }
        }
        // Charolite is a rare overworld ore; it drops shards unless mined with Silk Touch.
        writeJson('data/emberandfrost/loot_table/blocks/charolite_ore.json', oreLoot('charolite_ore', 'charolite_shard'))
        writeJson('assets/emberandfrost/blockstates/charolite_ore.json', [variants:['':[model:'emberandfrost:block/charolite_ore']]])
        writeJson('assets/emberandfrost/models/block/charolite_ore.json', [parent:'minecraft:block/cube_all', textures:[all:'emberandfrost:block/charolite_ore']])
        // Natural ore generation in the specified height bands.
        def ores = [
            // Cinder is the Nether-side Carbon Abyss material; keep its generation in the Nether.
            [id:'cinder', block:'cinder_ore', min:10, max:20, count:5, size:6, biome:'#emberandfrost:nether_biomes', replace:'minecraft:base_stone_nether'],
            // Cryolite belongs to the Overworld. Its crystal geodes are a separate worldgen feature to be added next.
            [id:'cryolite', block:'cryolite_ore', min:10, max:20, count:4, size:5, biome:'#emberandfrost:overworld_biomes', replace:'minecraft:stone_ore_replaceables'],
            // Ashen ore is Nether-only and restricted to the agreed Y=10..20 band.
            [id:'ashen', block:'ashen_ore', min:10, max:20, count:5, size:6, biome:'#emberandfrost:nether_biomes', replace:'minecraft:base_stone_nether'],
            // Magma ore belongs to the Overworld, inside the future Magma Crater biome.
            [id:'magma', block:'magma_ore', min:10, max:20, count:4, size:5, biome:'#emberandfrost:overworld_biomes', replace:'minecraft:stone_ore_replaceables'],
            [id:'charolite', block:'charolite_ore', min:-50, max:0, count:3, size:4, biome:'#minecraft:is_overworld', replace:'minecraft:stone_ore_replaceables']
        ]
        writeJson('data/minecraft/tags/block/mineable/pickaxe.json', [replace:false, values:['emberandfrost:cinder_ore','emberandfrost:cryolite_ore','emberandfrost:ashen_ore','emberandfrost:magma_ore','emberandfrost:charolite_ore']])
        writeJson('data/minecraft/tags/block/needs_iron_tool.json', [replace:false, values:['emberandfrost:cinder_ore']])
        writeJson('data/minecraft/tags/block/needs_diamond_tool.json', [replace:false, values:['emberandfrost:cryolite_ore','emberandfrost:ashen_ore','emberandfrost:magma_ore','emberandfrost:charolite_ore']])
        writeJson('data/minecraft/tags/block/incorrect_for_diamond_tool.json', [replace:false, values:['emberandfrost:magma_ore','emberandfrost:charolite_ore']])
        ores.each { ore ->
            def target = [target:[predicate_type:'minecraft:tag_match', tag:ore.replace], state:[Name:"emberandfrost:${ore.block}"]]
            writeJson("data/emberandfrost/worldgen/configured_feature/${ore.id}_ore.json", [
                type:'minecraft:ore', config:[size:ore.size, discard_chance_on_air_exposure:0.0, targets:[target]]
            ])
            writeJson("data/emberandfrost/worldgen/placed_feature/${ore.id}_ore.json", [
                feature:"emberandfrost:${ore.id}_ore",
                placement:[
                    [type:'minecraft:count', count:ore.count],
                    [type:'minecraft:in_square'],
                    [type:'minecraft:height_range', height:[type:'minecraft:uniform', min_inclusive:[absolute:ore.min], max_inclusive:[absolute:ore.max]]],
                    [type:'minecraft:biome']
                ]
            ])
            writeJson("data/emberandfrost/neoforge/biome_modifier/${ore.id}_ore.json", [
                type:'neoforge:add_features', biomes:ore.biome, features:"emberandfrost:${ore.id}_ore", step:'underground_ores'
            ])
        }

    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('generateEmberFrostResources')
}
