plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(), '--existing',
                file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources.srcDir('src/generated/resources')

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def emberGeneratedResources = layout.buildDirectory.dir('generated/emberandfrost')
sourceSets.main.resources.srcDir(emberGeneratedResources)

tasks.register('generateEmberFrostResources') {
    outputs.dir(emberGeneratedResources)
    doLast {
        def root = emberGeneratedResources.get().asFile
        def writeJson = { String relativePath, Object value ->
            if (!file("src/main/resources/${relativePath}").exists()) {
                def target = new File(root, relativePath)
                target.parentFile.mkdirs()
                target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value))
            }
        }
        def oreLoot = { String oreName, String dropName ->
            def silkCondition = [
                condition:'minecraft:match_tool',
                predicate:[predicates:['minecraft:enchantments':[[enchantments:'minecraft:silk_touch', levels:[min:1]]]]]
            ]
            def silkEntry = [type:'minecraft:item', name:"emberandfrost:${oreName}", conditions:[silkCondition]]
            def normalEntry = [type:'minecraft:item', name:"emberandfrost:${dropName}"]
            def alternatives = [type:'minecraft:alternatives', children:[silkEntry, normalEntry]]
            def pool = [rolls:1, entries:[alternatives]]
            [type:'minecraft:block', pools:[pool]]
        }
        def writePixelPng = { String relativePath, String kind, int rgb ->
            def target = new File(root, relativePath)
            if (!file("src/main/resources/${relativePath}").exists() && !target.exists()) {
                target.parentFile.mkdirs()
                def layerTexture = relativePath.contains('/equipment/')
                def image = new java.awt.image.BufferedImage(layerTexture ? 64 : 16, layerTexture ? 32 : 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def dark = new java.awt.Color((rgb >> 16 & 255) * 0.48 as int, (rgb >> 8 & 255) * 0.48 as int, (rgb & 255) * 0.48 as int).getRGB()
                def main = 0xFF000000 | rgb
                def light = new java.awt.Color(Math.min(255, ((rgb >> 16 & 255) * 1.28) as int), Math.min(255, ((rgb >> 8 & 255) * 1.28) as int), Math.min(255, ((rgb & 255) * 1.28) as int)).getRGB()
                def put = { int x, int y, int color ->
                    if (x >= 0 && x < 16 && y >= 0 && y < 16) {
                        if (layerTexture) { for(int dx=0;dx<4;dx++) for(int dy=0;dy<2;dy++) image.setRGB(x*4+dx,y*2+dy,color) }
                        else image.setRGB(x,y,color)
                    }
                }
                if (kind == 'helmet') {
                    for (int y=3;y<=11;y++) for (int x=3;x<=12;x++) if (y>=5 || (x>=5&&x<=10)) put(x,y,main)
                    for (int x=4;x<=11;x++) put(x,3,light)
                    for (int x=5;x<=10;x++) put(x,8,dark)
                } else if (kind == 'chestplate') {
                    for (int y=3;y<=13;y++) for (int x=2;x<=13;x++) if (!(y<6&&(x<5||x>10))) put(x,y,main)
                    for (int x=3;x<=12;x++) put(x,3,light)
                    for (int y=7;y<=12;y++){put(5,y,dark);put(10,y,dark)}
                } else if (kind == 'leggings') {
                    for (int y=2;y<=13;y++) for (int x=3;x<=12;x++) if (!(y>=8&&x>=7&&x<=8)) put(x,y,main)
                    for (int y=4;y<=12;y++){put(5,y,dark);put(10,y,dark)}
                } else if (kind == 'boots') {
                    for (int y=5;y<=12;y++){for(int x=3;x<=6;x++)put(x,y,main);for(int x=9;x<=12;x++)put(x,y,main)}
                    for (int x=2;x<=7;x++) put(x,13,dark)
                    for (int x=8;x<=13;x++) put(x,13,dark)
                } else if (kind in ['sword','pickaxe','axe','shovel','hoe']) {
                    for(int i=0;i<9;i++){put(4+i,12-i,main);put(5+i,12-i,light)}
                    if(kind=='sword'){for(int x=8;x<=13;x++)put(x,3,main);for(int y=3;y<=8;y++)put(13,y,main)}
                    if(kind=='pickaxe'){for(int x=3;x<=13;x++)put(x,3,main);put(4,4,dark);put(12,4,dark)}
                    if(kind=='axe'){for(int y=2;y<=7;y++)for(int x=8;x<=13;x++)put(x,y,main)}
                    if(kind=='shovel'){for(int y=2;y<=6;y++)for(int x=7;x<=11;x++)put(x,y,main)}
                    if(kind=='hoe'){for(int x=8;x<=13;x++)put(x,4,main)}
                } else {
                    for(int y=4;y<=11;y++)for(int x=4;x<=11;x++)if(Math.abs(x-7.5)+Math.abs(y-7.5)<=6)put(x,y,main)
                    put(6,5,light);put(7,5,light);put(8,6,light)
                }
                javax.imageio.ImageIO.write(image, 'png', target)
            }
        }
        def sets = [
            [id:'cinder', ru:'Углерун', ing:'cinder_ingot', ore:'cinder_ore'],
            [id:'cryolite', ru:'Криолит', ing:'cryolite_ingot', ore:'cryolite_ore'],
            [id:'ashen', ru:'Пепельный', ing:'ashen_ingot', ore:'ashen_ore'],
            [id:'magma', ru:'Магмовый', ing:'magma_ingot', ore:'magma_ore']
        ]
        def pieces = [
            [id:'helmet', ru:'шлем', pattern:['AAA','A A','   '], texture:'minecraft:item/diamond_helmet'],
            [id:'chestplate', ru:'нагрудник', pattern:['A A','ABA','AAA'], texture:'minecraft:item/diamond_chestplate'],
            [id:'leggings', ru:'поножи', pattern:['AAA','A A','A A'], texture:'minecraft:item/diamond_leggings'],
            [id:'boots', ru:'ботинки', pattern:['A A','A A','   '], texture:'minecraft:item/diamond_boots'],
            [id:'sword', ru:'меч', pattern:['A','A','B'], texture:'minecraft:item/iron_sword', handheld:true],
            [id:'pickaxe', ru:'кирка', pattern:['AAA',' B ',' B '], texture:'minecraft:item/iron_pickaxe', handheld:true],
            [id:'axe', ru:'топор', pattern:['AA','AB',' B'], texture:'minecraft:item/iron_axe', handheld:true],
            [id:'shovel', ru:'лопата', pattern:['A','B','B'], texture:'minecraft:item/iron_shovel', handheld:true],
            [id:'hoe', ru:'мотыга', pattern:['AA',' B',' B'], texture:'minecraft:item/iron_hoe', handheld:true]
        ]
        def ru = [
            'item.emberandfrost.cinder_ingot':'Слиток Углеруна',
            'item.emberandfrost.raw_cinder':'Необработанный Углерун',
            'item.emberandfrost.cryolite_ingot':'Слиток Криолита',
            'item.emberandfrost.raw_cryolite':'Необработанный Криолит',
            'item.emberandfrost.ashen_ingot':'Слиток Пепельного',
            'item.emberandfrost.raw_ashen':'Необработанный Пепельный',
            'item.emberandfrost.magma_ingot':'Слиток Магмы',
            'item.emberandfrost.raw_magma':'Необработанная Магма',
            'item.emberandfrost.charolite_shard':'Чаролитовый осколок',
            'block.emberandfrost.cinder_ore':'Углеруновая руда',
            'block.emberandfrost.cryolite_ore':'Криолитовая руда',
            'block.emberandfrost.ashen_ore':'Пепельная руда',
            'block.emberandfrost.magma_ore':'Магмовая руда',
            'block.emberandfrost.charolite_ore':'Чаролитовая руда'
        ]
        def en = [
            'item.emberandfrost.cinder_ingot':'Cinder Ingot','item.emberandfrost.raw_cinder':'Raw Cinder',
            'item.emberandfrost.cryolite_ingot':'Cryolite Ingot','item.emberandfrost.raw_cryolite':'Raw Cryolite',
            'item.emberandfrost.ashen_ingot':'Ashen Ingot','item.emberandfrost.raw_ashen':'Raw Ashen',
            'item.emberandfrost.magma_ingot':'Magma Ingot','item.emberandfrost.raw_magma':'Raw Magma',
            'item.emberandfrost.charolite_shard':'Charolite Shard',
            'block.emberandfrost.cinder_ore':'Cinder Ore','block.emberandfrost.cryolite_ore':'Cryolite Ore',
            'block.emberandfrost.ashen_ore':'Ashen Ore','block.emberandfrost.magma_ore':'Magma Ore',
            'block.emberandfrost.charolite_ore':'Charolite Ore'
        ]
        sets.each { s ->
            pieces.each { p ->
                def name = "${s.id}_${p.id}"
                def key = [A:"emberandfrost:${s.ing}", B:(p.id == 'chestplate' ? "emberandfrost:${s.ore}" : 'minecraft:stick')]
                writeJson("data/emberandfrost/recipe/${name}.json", [type:'minecraft:crafting_shaped', pattern:p.pattern, key:key, result:[id:"emberandfrost:${name}"]])
                writeJson("assets/emberandfrost/models/item/${name}.json", [parent:(p.handheld ? 'minecraft:item/handheld' : 'minecraft:item/generated'), textures:[layer0:"emberandfrost:item/${name}"]])
                writeJson("assets/emberandfrost/items/${name}.json", [model:[type:'minecraft:model', model:"emberandfrost:item/${name}"]])
                ru["item.emberandfrost.${name}"] = "${s.ru} ${p.ru}"
                en["item.emberandfrost.${name}"] = "${s.id.capitalize()} ${p.id.capitalize()}"
                def palettes = [cinder:0xE45B2A, cryolite:0x4BA9D8, ashen:0x777777, magma:0xB52D18]
                writePixelPng("assets/emberandfrost/textures/item/${name}.png", p.id, palettes[s.id])
            }
            def palettes = [cinder:0xE45B2A, cryolite:0x4BA9D8, ashen:0x777777, magma:0xB52D18]
            writeJson("assets/emberandfrost/equipment/${s.id}.json", [layers:[humanoid:[[texture:"emberandfrost:${s.id}_layer_1"]], humanoid_leggings:[[texture:"emberandfrost:${s.id}_layer_1"]]]])
            writePixelPng("assets/emberandfrost/textures/entity/equipment/humanoid/${s.id}_layer_1.png", "chestplate", palettes[s.id])
            writePixelPng("assets/emberandfrost/textures/entity/equipment/humanoid_leggings/${s.id}_layer_1.png", "leggings", palettes[s.id])
            def projectileTypes = [fire:[ingredient:'minecraft:gunpowder', ru:'Огненный снаряд', en:'Fire Projectile'], slow:[ingredient:'minecraft:snowball', ru:'Ледяной снаряд', en:'Frost Projectile'], knockback:[ingredient:'minecraft:feather', ru:'Отбрасывающий снаряд', en:'Knockback Projectile'], poison:[ingredient:'minecraft:spider_eye', ru:'Ядовитый снаряд', en:'Poison Projectile']]
            projectileTypes.each { type, data ->
                def id = "${s.id}_${type}_projectile"
                writeJson("data/emberandfrost/recipe/${id}.json", [type:'minecraft:crafting_shaped', pattern:[' A ','ABA',' A '], key:[A:"emberandfrost:${s.ing}", B:data.ingredient], result:[id:"emberandfrost:${id}", count:1]])
                writeJson("assets/emberandfrost/models/item/${id}.json", [parent:'minecraft:item/generated', textures:[layer0:"emberandfrost:item/${id}"]])
                writeJson("assets/emberandfrost/items/${id}.json", [model:[type:'minecraft:model', model:"emberandfrost:item/${id}"]])
                ru["item.emberandfrost.${id}"] = "${s.ru}: ${data.ru}"
                en["item.emberandfrost.${id}"] = "${s.id.capitalize()} ${data.en}"
                writePixelPng("assets/emberandfrost/textures/item/${id}.png", "projectile", palettes[s.id])
            }
            writeJson("data/emberandfrost/tags/item/repairs_${s.id}.json", [replace:false, values:["emberandfrost:${s.ing}"]])
            writeJson("data/emberandfrost/loot_table/blocks/${s.ore}.json", oreLoot(s.ore, "raw_${s.id}"))
            writeJson("assets/emberandfrost/blockstates/${s.ore}.json", [variants:['':[model:"emberandfrost:block/${s.ore}"]]])
            def texture = s.id == 'magma' ? 'netherrack' : (s.id == 'cryolite' ? 'packed_ice' : (s.id == 'ashen' ? 'blackstone' : 'deepslate'))
            writeJson("assets/emberandfrost/models/block/${s.ore}.json", [parent:'minecraft:block/cube_all', textures:[all:"minecraft:block/${texture}"]])
            writeJson("data/emberandfrost/tags/item/repairs_${s.id}.json", [replace:false, values:["emberandfrost:${s.ing}"]])
        }
        writeJson('data/emberandfrost/tags/item/repairs_armor.json', [replace:false, values:['emberandfrost:cinder_ingot','emberandfrost:cryolite_ingot','emberandfrost:ashen_ingot','emberandfrost:magma_ingot']])
        ['cinder_ingot','raw_cinder','cryolite_ingot','raw_cryolite','ashen_ingot','raw_ashen','magma_ingot','raw_magma','charolite_shard'].each { item ->
            writeJson("assets/emberandfrost/items/${item}.json", [model:[type:'minecraft:model', model:"emberandfrost:item/${item}"]])
        }
        ['cinder_ore','cryolite_ore','ashen_ore','magma_ore','charolite_ore'].each { ore ->
            writeJson("assets/emberandfrost/items/${ore}.json", [model:[type:'minecraft:model', model:"emberandfrost:block/${ore}"]])
        }
        writeJson('assets/emberandfrost/lang/ru_ru.json', ru)
        writeJson('assets/emberandfrost/lang/en_us.json', en)

        // Smelting and blasting for the four raw materials.
        sets.each { s ->
            ['smelting':200, 'blasting':100].each { recipeType, ticks ->
                writeJson("data/emberandfrost/recipe/${s.id}_${recipeType}.json", [
                    type:"minecraft:${recipeType}", category:'misc', cookingtime:ticks,
                    experience:0.7, ingredient:[item:"emberandfrost:raw_${s.id}"],
                    result:[id:"emberandfrost:${s.ing}"]
                ])
            }
        }
        // Charolite is a rare overworld ore; it drops shards unless mined with Silk Touch.
        writeJson('data/emberandfrost/loot_table/blocks/charolite_ore.json', oreLoot('charolite_ore', 'charolite_shard'))
        writeJson('assets/emberandfrost/blockstates/charolite_ore.json', [variants:['':[model:'emberandfrost:block/charolite_ore']]])
        writeJson('assets/emberandfrost/models/block/charolite_ore.json', [parent:'minecraft:block/cube_all', textures:[all:'minecraft:block/amethyst_block']])
        // Four data-driven enchantments with their intended level caps.
        def enchantments = [
            sharpness_viii:[description:'enchantment.emberandfrost.sharpness_viii', supported:'#minecraft:enchantable/weapon', max:8, slots:['mainhand'], effects:['minecraft:damage':[[effect:[type:'minecraft:add', value:[type:'minecraft:linear', base:0.5, per_level_above_first:0.5]]]]]],
            protection_v:[description:'enchantment.emberandfrost.protection_v', supported:'#minecraft:enchantable/armor', max:5, slots:['armor'], effects:['minecraft:damage_protection':[[effect:[type:'minecraft:add', value:[type:'minecraft:linear', base:1.0, per_level_above_first:0.5]]]], 'minecraft:attributes':[[id:'emberandfrost:protection_v_slowdown', attribute:'minecraft:movement_speed', amount:[type:'minecraft:linear', base:-0.03, per_level_above_first:-0.03], operation:'add_multiplied_total']]]],
            durability_iv:[description:'enchantment.emberandfrost.durability_iv', supported:'#minecraft:enchantable/durability', max:4, slots:['any'], effects:['minecraft:item_damage':[[effect:[type:'minecraft:remove_binomial', chance:[type:'minecraft:linear', base:0.1, per_level_above_first:0.1]]]]]],
            efficiency_vii:[description:'enchantment.emberandfrost.efficiency_vii', supported:'#minecraft:enchantable/mining', max:7, slots:['mainhand'], effects:['minecraft:attributes':[[id:'emberandfrost:efficiency_vii_speed', attribute:'minecraft:block_break_speed', amount:[type:'minecraft:linear', base:0.25, per_level_above_first:0.25], operation:'add_value']]]]
        ]
        enchantments.each { id, e ->
            writeJson("data/emberandfrost/enchantment/${id}.json", [
                description:[translate:e.description], supported_items:e.supported, primary_items:e.supported,
                weight:4, max_level:e.max, min_cost:[base:1, per_level_above_first:10],
                max_cost:[base:20, per_level_above_first:10], anvil_cost:4, slots:e.slots, effects:e.effects
            ])
        }
        ru.putAll([
            'enchantment.emberandfrost.sharpness_viii':'Острота VIII',
            'enchantment.emberandfrost.protection_v':'Защита V',
            'enchantment.emberandfrost.durability_iv':'Прочность IV',
            'enchantment.emberandfrost.efficiency_vii':'Эффективность VII'
        ])
        en.putAll([
            'enchantment.emberandfrost.sharpness_viii':'Sharpness VIII',
            'enchantment.emberandfrost.protection_v':'Protection V',
            'enchantment.emberandfrost.durability_iv':'Durability IV',
            'enchantment.emberandfrost.efficiency_vii':'Efficiency VII'
        ])
        // Natural ore generation in the specified height bands.
        def ores = [
            [id:'cinder', block:'cinder_ore', min:20, max:60, count:9, size:9, biome:'#minecraft:is_overworld', replace:'minecraft:stone_ore_replaceables'],
            [id:'cryolite', block:'cryolite_ore', min:-10, max:30, count:7, size:7, biome:'#minecraft:is_overworld', replace:'minecraft:stone_ore_replaceables'],
            [id:'ashen', block:'ashen_ore', min:30, max:90, count:8, size:8, biome:'#minecraft:is_nether', replace:'minecraft:base_stone_nether'],
            [id:'magma', block:'magma_ore', min:10, max:50, count:6, size:6, biome:'#minecraft:is_nether', replace:'minecraft:base_stone_nether'],
            [id:'charolite', block:'charolite_ore', min:-50, max:0, count:3, size:4, biome:'#minecraft:is_overworld', replace:'minecraft:stone_ore_replaceables']
        ]
        writeJson('data/minecraft/tags/block/mineable/pickaxe.json', [replace:false, values:['emberandfrost:cinder_ore','emberandfrost:cryolite_ore','emberandfrost:ashen_ore','emberandfrost:magma_ore','emberandfrost:charolite_ore']])
        writeJson('data/minecraft/tags/block/needs_iron_tool.json', [replace:false, values:['emberandfrost:cinder_ore']])
        writeJson('data/minecraft/tags/block/needs_diamond_tool.json', [replace:false, values:['emberandfrost:cryolite_ore','emberandfrost:ashen_ore','emberandfrost:magma_ore','emberandfrost:charolite_ore']])
        writeJson('data/minecraft/tags/block/incorrect_for_diamond_tool.json', [replace:false, values:['emberandfrost:magma_ore','emberandfrost:charolite_ore']])
        ores.each { ore ->
            def target = [target:[predicate_type:'minecraft:tag_match', tag:ore.replace], state:[Name:"emberandfrost:${ore.block}"]]
            writeJson("data/emberandfrost/worldgen/configured_feature/${ore.id}_ore.json", [
                type:'minecraft:ore', config:[size:ore.size, discard_chance_on_air_exposure:0.0, targets:[target]]
            ])
            writeJson("data/emberandfrost/worldgen/placed_feature/${ore.id}_ore.json", [
                feature:"emberandfrost:${ore.id}_ore",
                placement:[
                    [type:'minecraft:count', count:ore.count],
                    [type:'minecraft:in_square'],
                    [type:'minecraft:height_range', height:[type:'minecraft:uniform', min_inclusive:[absolute:ore.min], max_inclusive:[absolute:ore.max]]],
                    [type:'minecraft:biome']
                ]
            ])
            writeJson("data/emberandfrost/neoforge/biome_modifier/${ore.id}_ore.json", [
                type:'neoforge:add_features', biomes:ore.biome, features:"emberandfrost:${ore.id}_ore", step:'underground_ores'
            ])
        }

    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('generateEmberFrostResources')
}
